# cloud/docker-compose.yml
# Runs on the Oracle Cloud free-tier VM (ap-singapore-1).
# Deploy directory on the VM: /opt/valuecell/
#
# Usage on the VM:
#   cd /opt/valuecell
#   docker compose pull && docker compose up -d

services:
  app:
    image: ghcr.io/${GHCR_OWNER:-lukecold}/valuecell:latest
    container_name: valuecell
    restart: always
    ports:
      - "8080:8080"
    environment:
      APP_ENVIRONMENT: production
      API_DEBUG: "false"
      # Tells FastAPI where the built React SPA lives inside the image.
      FRONTEND_BUILD_DIR: /app/static
      # Database URL – defaults to SQLite on the host volume; override with a
      # PostgreSQL DSN (set VALUECELL_DATABASE_URL in /opt/valuecell/.env on the VM).
      # e.g. postgresql+psycopg2://postgres:<pw>@<host>:5432/valuecell?sslmode=require
      VALUECELL_DATABASE_URL: "${VALUECELL_DATABASE_URL:-sqlite:////data/valuecell.db}"
      # ── AI provider keys ──────────────────────────────────────────────────────
      # Set these in /opt/valuecell/.env on the VM (never commit real keys):
      #   echo "OPENAI_API_KEY=sk-..." >> /opt/valuecell/.env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # ── GCP Secret Manager (recommended: loads exchange keys at startup) ────────
      # Store credentials as a GCP secret (KEY=VALUE lines), then set these two:
      #   echo "GCP_SECRET_NAME=BinanceSecrets" >> /opt/valuecell/.env
      #   echo "GCP_PROJECT_ID=<your-project-id>" >> /opt/valuecell/.env
      # The VM service account needs the "Secret Manager Secret Accessor" IAM role.
      GCP_SECRET_NAME: ${GCP_SECRET_NAME:-}
      # ── Resource optimisation (e2-micro / constrained hosts) ──────────────────
      # Skip Chinese-stock adapters (AKShare, BaoStock) — not needed for crypto.
      DISABLE_STOCK_ADAPTERS: "1"
      # Run market-data fetches one-at-a-time instead of concurrently.
      SEQUENTIAL_DATA_FETCH: "1"
      # Decision-cycle hard timeout in seconds (default 900 = 15 min).
      # Increase if deepseek-reasoner regularly exceeds this limit.
      STRATEGY_CYCLE_TIMEOUT_S: "900"
      # Thread-pool workers for agent-class resolution (1 is enough for a
      # single StrategyAgent deployment).
      AGENT_THREAD_WORKERS: "1"
      # ── Exchange credentials (for live trading auto-resume) ────────────────────
      # Alternative to GCP secrets: set keys directly in /opt/valuecell/.env.
      # Convention: {EXCHANGE_ID_UPPER}_API_KEY / _SECRET_KEY / _PASSPHRASE
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY:-}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_SECRET_KEY: ${OKX_SECRET_KEY:-}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_SECRET_KEY: ${BYBIT_SECRET_KEY:-}
    volumes:
      # Persistent data directory – SQLite DB lives here.
      - /opt/valuecell/data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "gcplogs"
      options:
        gcp-log-cmd: "true"
        labels: "app"
