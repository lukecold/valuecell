# cloud/docker-compose.yml
# Runs on the Oracle Cloud free-tier VM (ap-singapore-1).
# Deploy directory on the VM: /opt/valuecell/
#
# Usage on the VM:
#   cd /opt/valuecell
#   docker compose pull && docker compose up -d

services:
  app:
    image: ghcr.io/${GHCR_OWNER:-lukecold}/valuecell:latest
    container_name: valuecell
    restart: always
    ports:
      - "8080:8080"
    environment:
      APP_ENVIRONMENT: production
      API_DEBUG: "false"
      # Tells FastAPI where the built React SPA lives inside the image.
      FRONTEND_BUILD_DIR: /app/static
      # Database URL – defaults to SQLite on the host volume; override with a
      # PostgreSQL DSN (set VALUECELL_DATABASE_URL in /opt/valuecell/.env on the VM).
      # e.g. postgresql+psycopg2://postgres:<pw>@<host>:5432/valuecell?sslmode=require
      VALUECELL_DATABASE_URL: "${VALUECELL_DATABASE_URL:-sqlite:////data/valuecell.db}"
      # ── AI provider keys ──────────────────────────────────────────────────────
      # Set these in /opt/valuecell/.env on the VM (never commit real keys):
      #   echo "OPENAI_API_KEY=sk-..." >> /opt/valuecell/.env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # ── Exchange credentials (for live trading auto-resume) ────────────────────
      # Live strategies lose credentials on restart (not stored in DB for security).
      # Set exchange keys here so they can be re-injected when strategies auto-resume.
      # Convention: {EXCHANGE_ID_UPPER}_API_KEY / _SECRET_KEY / _PASSPHRASE
      #   echo "BINANCE_API_KEY=..." >> /opt/valuecell/.env
      #   echo "BINANCE_SECRET_KEY=..." >> /opt/valuecell/.env
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY:-}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_SECRET_KEY: ${OKX_SECRET_KEY:-}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_SECRET_KEY: ${BYBIT_SECRET_KEY:-}
    volumes:
      # Persistent data directory – SQLite DB lives here.
      - /opt/valuecell/data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
